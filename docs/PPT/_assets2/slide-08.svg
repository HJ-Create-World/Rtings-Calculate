<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"><rect x="0" y="0" width="960" height="540" fill="#FFFFFF" /><rect x="48" y="30" width="7" height="28" fill="#0048A8" /><text x="66" y="53" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="19" font-weight="700" fill="#0048A8" text-anchor="start">04  代码介绍｜评分引擎核心实现</text><text x="912" y="51" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" font-weight="400" fill="#7F7F7F" text-anchor="end">内部资料 · 注意保密</text><line x1="48" y1="74" x2="912" y2="74" stroke="#BFBFBF" stroke-width="1"/><text x="48" y="100" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12.5" font-weight="400" fill="#7F7F7F" text-anchor="start">以类型契约与算法显式化，把“经验公式”落成可维护、可测试的工程代码</text><line x1="48" y1="506" x2="912" y2="506" stroke="#BFBFBF" stroke-width="1"/><text x="48" y="526" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11" font-weight="400" fill="#7F7F7F" text-anchor="start">S02-软件开发组 · 统一评分工作台</text><text x="480" y="526" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11" font-weight="400" fill="#7F7F7F" text-anchor="middle">v0.1.0 · 规则 v3.0</text><text x="912" y="526" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11" font-weight="400" fill="#7F7F7F" text-anchor="end">8 / 10</text><rect x="48" y="120" width="420" height="340" fill="#FFFFFF" stroke="#BFBFBF" stroke-width="1"/><rect x="48" y="120" width="420" height="28" fill="#0048A8" /><text x="58" y="139" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="start">src/core/mapping.ts｜客观项统一入口</text><text x="58" y="166" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" font-weight="400" fill="#404040" text-anchor="start">export function mapObjectiveValue(</text><text x="58" y="183" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" font-weight="400" fill="#404040" text-anchor="start">  mapping, value, text</text><text x="58" y="200" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" font-weight="400" fill="#404040" text-anchor="start">): MappingTrace {</text><text x="58" y="217" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" font-weight="400" fill="#404040" text-anchor="start">  if (kind === categorical)</text><text x="58" y="234" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" font-weight="400" fill="#404040" text-anchor="start">    return mapByCategorical(...);</text><text x="58" y="251" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" font-weight="400" fill="#404040" text-anchor="start">  if (value === null) return incomplete;</text><text x="58" y="268" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" font-weight="400" fill="#404040" text-anchor="start">  if (kind === anchors)</text><text x="58" y="285" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" font-weight="400" fill="#404040" text-anchor="start">    return mapByAnchors(mapping, value);</text><text x="58" y="302" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" font-weight="400" fill="#404040" text-anchor="start">  if (kind === identity)</text><text x="58" y="319" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" font-weight="400" fill="#404040" text-anchor="start">    return mapByIdentity(...);</text><text x="58" y="336" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" font-weight="400" fill="#404040" text-anchor="start">  return mapByIntervals(...);</text><text x="58" y="353" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" font-weight="400" fill="#404040" text-anchor="start">}</text><text x="58" y="370" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" font-weight="400" fill="#7F7F7F" text-anchor="start"></text><text x="58" y="387" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" font-weight="400" fill="#7F7F7F" text-anchor="start">function mapByAnchors(mapping, value) {</text><text x="58" y="404" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" font-weight="400" fill="#7F7F7F" text-anchor="start">  // 范围内线性插值；范围外线性外推</text><text x="58" y="421" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" font-weight="400" fill="#7F7F7F" text-anchor="start">  // 0~10 限幅，并标注 EXTRAPOLATED_SCORE</text><text x="58" y="438" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" font-weight="400" fill="#7F7F7F" text-anchor="start">  ...</text><text x="58" y="455" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" font-weight="400" fill="#7F7F7F" text-anchor="start">}</text><rect x="484" y="120" width="428" height="340" fill="#FFFFFF" stroke="#BFBFBF" stroke-width="1"/><rect x="484" y="120" width="428" height="28" fill="#1F3864" /><text x="494" y="139" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="start">src/core/evaluate.ts｜聚合与追踪</text><text x="494" y="166" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" font-weight="400" fill="#404040" text-anchor="start">export function evaluateRule(rule, inputs) {</text><text x="494" y="184" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" font-weight="400" fill="#404040" text-anchor="start">  validateRule(rule);  // 循环依赖 / 父项校验</text><text x="494" y="202" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" font-weight="400" fill="#404040" text-anchor="start">  const evaluated = new Map();</text><text x="494" y="220" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" font-weight="400" fill="#404040" text-anchor="start">  function evaluateNode(nodeId) {</text><text x="494" y="238" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" font-weight="400" fill="#404040" text-anchor="start">    if (node.inputType === aggregate) {</text><text x="494" y="256" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" font-weight="400" fill="#404040" text-anchor="start">      // renormalize: 剔除缺失子项后按权重归一</text><text x="494" y="274" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" font-weight="400" fill="#404040" text-anchor="start">      // excelSum: 保留原工作簿口径</text><text x="494" y="292" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" font-weight="400" fill="#404040" text-anchor="start">      // roundingStep: 逐级 0.1 舍入</text><text x="494" y="310" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" font-weight="400" fill="#404040" text-anchor="start">      contributionToParent =</text><text x="494" y="328" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" font-weight="400" fill="#404040" text-anchor="start">        weight * value / weightSum;</text><text x="494" y="346" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" font-weight="400" fill="#404040" text-anchor="start">      return { status, value, children, warnings };</text><text x="494" y="364" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" font-weight="400" fill="#404040" text-anchor="start">    }</text><text x="494" y="382" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" font-weight="400" fill="#404040" text-anchor="start">    const trace = mapObjectiveValue(...);</text><text x="494" y="400" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" font-weight="400" fill="#404040" text-anchor="start">    return { ...trace, mappingTrace: trace };</text><text x="494" y="418" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" font-weight="400" fill="#404040" text-anchor="start">  }</text><text x="494" y="436" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" font-weight="400" fill="#404040" text-anchor="start">  return { rootId, children, nodes, warnings };</text><text x="494" y="454" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" font-weight="400" fill="#404040" text-anchor="start">}</text><rect x="48" y="470" width="864" height="28" fill="#F2F2F2" stroke="#BFBFBF" stroke-width="1"/><text x="60" y="489" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11" font-weight="400" fill="#404040" text-anchor="start">类型契约：ScoreTenths 用 8~100 表示 0.8~10.0；告警码覆盖权重和不为 1 / 区间重叠 / 无命中 / 范围外预估等</text></svg>