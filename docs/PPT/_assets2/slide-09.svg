oft YaHei, SimHei, sans-serif" font-size="12.5" font-weight="600" fill="#7F3F3F" text-anchor="start">汇报缺结构化材料</text><path d="M466 393 L494 393 M488 387 L494 393 L488 399" fill="none" stroke="#0048A8" stroke-width="1.5"/><rect x="502" y="368" width="410" height="50" fill="#FFFFFF" stroke="#BFBFBF" stroke-width="1"/><text x="512" y="399" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12.5" font-weight="600" fill="#0048A8" text-anchor="start">一键导出带明细、计算追踪与总览图表的 Excel 报告</text><rect x="48" y="436" width="864" height="60" fill="#F2F2F2" stroke="#BFBFBF" stroke-width="1"/><text x="60" y="455" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" font-weight="400" fill="#404040" text-anchor="start">数据分析　多机型总分 / 主维度 / 测试项三级对比，天梯图 + 热力表 + 雷达图，区间查询联动筛选</text><text x="60" y="474" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" font-weight="400" fill="#404040" text-anchor="start">数据查询　筛选预设与对比组模板一键复用；107 款基准 + 云端历史 + 本机草稿统一检索</text></svg>