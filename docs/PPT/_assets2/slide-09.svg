<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"><rect x="0" y="0" width="960" height="540" fill="#FFFFFF" /><rect x="48" y="30" width="7" height="28" fill="#0048A8" /><text x="66" y="53" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="19" font-weight="700" fill="#0048A8" text-anchor="start">05  主要优势｜从黑盒引用到可运营</text><text x="912" y="51" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" font-weight="400" fill="#7F7F7F" text-anchor="end">内部资料 · 注意保密</text><line x1="48" y1="74" x2="912" y2="74" stroke="#BFBFBF" stroke-width="1"/><text x="48" y="100" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12.5" font-weight="400" fill="#7F7F7F" text-anchor="start">五项工作方式升级，把评分从“看结果”变成“可追问、可复用、可沉淀”</text><line x1="48" y1="506" x2="912" y2="506" stroke="#BFBFBF" stroke-width="1"/><text x="48" y="526" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11" font-weight="400" fill="#7F7F7F" text-anchor="start">S02-软件开发组 · 统一评分工作台</text><text x="480" y="526" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11" font-weight="400" fill="#7F7F7F" text-anchor="middle">v0.1.0 · 规则 v3.0</text><text x="912" y="526" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11" font-weight="400" fill="#7F7F7F" text-anchor="end">9 / 10</text><rect x="48" y="120" width="410" height="50" fill="#F2F2F2" stroke="#BFBFBF" stroke-width="1"/><text x="58" y="151" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12.5" font-weight="600" fill="#7F3F3F" text-anchor="start">公式黑盒，只能引用结果</text><path d="M466 145 L494 145 M488 139 L494 145 L488 151" fill="none" stroke="#0048A8" stroke-width="1.5"/><rect x="502" y="120" width="410" height="50" fill="#FFFFFF" stroke="#BFBFBF" stroke-width="1"/><text x="512" y="151" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12.5" font-weight="600" fill="#0048A8" text-anchor="start">基于 107 款公开数据反推锚点曲线，输出可复算、可追问的评分路径</text><rect x="48" y="182" width="4