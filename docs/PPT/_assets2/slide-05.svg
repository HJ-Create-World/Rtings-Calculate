<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"><rect x="0" y="0" width="960" height="540" fill="#FFFFFF" /><rect x="48" y="30" width="7" height="28" fill="#0048A8" /><text x="66" y="53" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="19" font-weight="700" fill="#0048A8" text-anchor="start">02  评分机制｜从数据到规则</text><text x="912" y="51" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" font-weight="400" fill="#7F7F7F" text-anchor="end">内部资料 · 注意保密</text><line x1="48" y1="74" x2="912" y2="74" stroke="#BFBFBF" stroke-width="1"/><text x="48" y="100" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12.5" font-weight="400" fill="#7F7F7F" text-anchor="start">工程师拆解表 × 公开实测数据，双源融合生成可复算规则</text><line x1="48" y1="506" x2="912" y2="506" stroke="#BFBFBF" stroke-width="1"/><text x="48" y="526" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11" font-weight="400" fill="#7F7F7F" text-anchor="start">S02-软件开发组 · 统一评分工作台</text><text x="480" y="526" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11" font-weight="400" fill="#7F7F7F" text-anchor="middle">v0.1.0 · 规则 v3.0</text><text x="912" y="526" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11" font-weight="400" fill="#7F7F7F" text-anchor="end">5 / 10</text><rect x="48" y="120" width="420" height="120" fill="#FFFFFF" stroke="#BFBFBF" stroke-width="1"/><rect x="48" y="120" width="420" height="28" fill="#0048A8" /><text x="58" y="139" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start">工程师拆解表（8 个工作表）</text><text x="58" y="168" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" font-weight="400" fill="#404040" text-anchor="start">权重树 · 7/8 分门槛 · 得分范围 · 实测样本</text><text x="58" y="188" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" font-weight="400" fill="#404040" text-anchor="start">无数据验证处标注证据等级 C / D；主观项 0~10 直评</text><text x="58" y="208" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" font-weight="400" fill="#404040" text-anchor="start">区间统一“下含上不含”，10.0 分为开放上界</text><rect x="492" y="120" width="420" height="120" fill="#FFFFFF" stroke="#BFBFBF" stroke-width="1"/><rect x="492" y="120" width="420" height="28" fill="#0048A8" /><text x="502" y="139" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start">公开实测数据（2026-11-17 快照）</text><text x="502" y="168" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" font-weight="400" fill="#404040" text-anchor="start">107 款机型 × 440 列原始实测值与官方得分</text><text x="502" y="188" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" font-weight="400" fill="#404040" text-anchor="start">逐款反推锚点曲线并做回归验证，标注证据 A / B</text><text x="502" y="208" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" font-weight="400" fill="#404040" text-anchor="start">冲突区间显式告警，不把回归系数当作公式</text><path d="M258 240 L258 252 M480 240 L480 252 M258 252 L480 252 M469 247 L480 252 L469 257" fill="none" stroke="#0048A8" stroke-width="1.5"/><rect x="180" y="258" width="600" height="54" fill="#0048A8" /><text x="480" y="290" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">双源融合引擎　锚点插值 / 类别映射 / 主观直评 / 缺失重归一 / 范围外预估</text><rect x="180" y="328" width="600" height="44" fill="#EAF1FB" stroke="#BFBFBF" stroke-width="1"/><text x="480" y="356" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="600" fill="#0048A8" text-anchor="middle">规则 v3.0　132 个节点 · 93 条映射 · 94 个计分项 · 逐级 0.1 舍入</text><rect x="48" y="390" width="280" height="92" fill="#FFFFFF" stroke="#BFBFBF" stroke-width="1"/><text x="62" y="424" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" font-weight="700" fill="#0048A8" text-anchor="start">104 / 107</text><text x="62" y="456" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" font-weight="400" fill="#404040" text-anchor="start">回归总分误差 ≤0.1；3 款 ≤0.2（含 8K 特例）</text><rect x="344" y="390" width="280" height="92" fill="#FFFFFF" stroke="#BFBFBF" stroke-width="1"/><text x="358" y="424" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" font-weight="700" fill="#0048A8" text-anchor="start">96.6%</text><text x="358" y="456" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" font-weight="400" fill="#404040" text-anchor="start">工程师分档与数据分档一致（767 / 794）</text><rect x="640" y="390" width="280" height="92" fill="#FFFFFF" stroke="#BFBFBF" stroke-width="1"/><text x="654" y="424" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" font-weight="700" fill="#0048A8" text-anchor="start">A / B / C / D</text><text x="654" y="456" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" font-weight="400" fill="#404040" text-anchor="start">证据等级全程标注，缺失与预估显式提示</text></svg>